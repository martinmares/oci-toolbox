services:
  registry:
    image: registry:3
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    expose:
      - "5000"

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - registry
    ports:
      - "5443:5443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O - https://127.0.0.1:5443/v2/ >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 20
