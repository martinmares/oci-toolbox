name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/shadow/extractor/go.mod
      - name: Build embedded extractors
        run: bash scripts/build_embedded_extractors.sh
      - name: Test
        run: |
          go test ./...
          cd internal/shadow/extractor && go test ./...
      - name: Generate release notes
        run: bash scripts/ci_release_notes.sh
      - name: Build release packages
        run: bash scripts/ci_package_release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci_publish_github_release.sh
